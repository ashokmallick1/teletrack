server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # APK direct download with explicit MIME headers
    location = /teletrack.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="teletrack.apk"';
        try_files /teletrack.apk =404;
    }

    # Desktop package direct download
    location = /teletrack-desktop.zip {
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="teletrack-desktop.zip"';
        try_files /teletrack-desktop.zip =404;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://teletrack-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check proxy
    location = /health {
        proxy_pass http://teletrack-api:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single-Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
