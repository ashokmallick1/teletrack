services:
  postgres:
    image: postgres:16-alpine
    container_name: callyzer-postgres
    restart: always
    environment:
      POSTGRES_USER: callyzer_user
      POSTGRES_PASSWORD: callyzer_password_dev_only
      POSTGRES_DB: callyzer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/seed/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callyzer_user -d callyzer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: callyzer-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: dev_jwt_secret_change_in_production_2026
      DATABASE_URL: postgresql://callyzer_user:callyzer_password_dev_only@postgres:5432/callyzer_db

volumes:
  pgdata:
