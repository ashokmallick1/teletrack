version: '3.8'

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: teletrack-evolution-api
    restart: always
    ports:
      - "8085:8080"
    environment:
      - SERVER_URL=http://localhost:8085
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=teletrack_evolution_secret_key_2026
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=https://teletrack-api.bhashaai.in/api/v1/whatsapp/evolution/webhook
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#1e293b
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
    name: teletrack_evolution_instances
  evolution_store:
    name: teletrack_evolution_store
